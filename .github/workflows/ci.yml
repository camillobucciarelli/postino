name: CI

# Sulle PR niente `pull_request`: la lancia codex-ok.yml con workflow_dispatch sul branch quando Codex non trova
# rilievi sul commit di testa (#246), o a mano: `gh workflow run ci.yml --ref <branch> -f pr=<numero>`.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: 'Numero della PR: si testa il merge con main (refs/pull/N/merge), come faceva pull_request'
        type: number
      sha:
        description: 'Commit recensito da Codex: la run fallisce se il branch nel frattempo è andato avanti'
        type: string

permissions:
  contents: read

# Una sola runner self-hosted: le run superate di un branch di PR non devono accodarsi; quelle di main sì.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    # Self-hosted Mac (come apple): Flutter dal PATH del runner, niente flutter-action.
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr && format('refs/pull/{0}/merge', inputs.pr) || '' }}
          fetch-depth: 2
      - name: PR commit
        env:
          PR: ${{ inputs.pr }}
          SHA: ${{ inputs.sha }}
        run: |
          test -z "$SHA" || test "$SHA" = "$GITHUB_SHA" || { echo "::error::branch moved past the reviewed $SHA"; exit 1; }
          case "$PR" in ''|0) ;; *) test "$(git rev-parse HEAD^2)" = "$GITHUB_SHA" \
            || { echo "::error::refs/pull/$PR/merge does not merge $GITHUB_SHA"; exit 1; } ;; esac
      - name: Flutter matches .fvmrc
        run: |
          want=$(sed -n 's/.*"flutter"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .fvmrc)
          have=$(flutter --version | sed -n 's/^Flutter \([^ ]*\).*/\1/p')
          test "$want" = "$have" || { echo "Flutter $have on runner, $want pinned"; exit 1; }
      - run: flutter pub get
      - name: Codegen
        run: |
          dart run routefly
          dart run slang
          dart run build_runner build
      - name: Generated code is committed
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
      # Generated files stay as the generators emit them.
      - name: Format
        run: |
          git ls-files -- 'lib/*.dart' 'test/*.dart' 'integration_test/*.dart' \
            | grep -vE '\.(g|freezed|config|route)\.dart$' \
            | xargs dart format --output=none --set-exit-if-changed
      - run: flutter analyze --fatal-infos
      # I test `imap` avviano da soli GreenMail (jar fissato e verificato, scaricato in .dart_tool/greenmail): con
      # POSTINO_REQUIRE_IMAP_SERVER=1 un Java mancante fa fallire il job invece di saltare i test.
      - name: flutter test
        env:
          POSTINO_REQUIRE_IMAP_SERVER: '1'
        run: flutter test
      - run: tool/release/version_test.sh
      - run: tool/release/verify_apk_test.sh
      - run: tool/release/build_number_test.sh
      - run: tool/release/appcast_test.sh
      - run: tool/release/r2_unreleased_test.sh
      - run: tool/release/ios_export_options_test.sh
      - run: tool/release/guide_check_test.sh
      - run: tool/ci/codex_ok_test.sh

  android:
    # JDK: quello di Android Studio, trovato da Flutter; ANDROID_HOME sul runner.
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr && format('refs/pull/{0}/merge', inputs.pr) || '' }}
          fetch-depth: 2
      - name: PR commit
        env:
          PR: ${{ inputs.pr }}
          SHA: ${{ inputs.sha }}
        run: |
          test -z "$SHA" || test "$SHA" = "$GITHUB_SHA" || { echo "::error::branch moved past the reviewed $SHA"; exit 1; }
          case "$PR" in ''|0) ;; *) test "$(git rev-parse HEAD^2)" = "$GITHUB_SHA" \
            || { echo "::error::refs/pull/$PR/merge does not merge $GITHUB_SHA"; exit 1; } ;; esac
      - name: Flutter matches .fvmrc
        run: |
          want=$(sed -n 's/.*"flutter"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .fvmrc)
          have=$(flutter --version | sed -n 's/^Flutter \([^ ]*\).*/\1/p')
          test "$want" = "$have" || { echo "Flutter $have on runner, $want pinned"; exit 1; }
      - run: flutter pub get
      - name: Codegen
        run: |
          dart run routefly
          dart run slang
          dart run build_runner build
      - run: flutter build apk --debug

  # Job `linux` e `windows` rimossi: niente minuti GitHub-hosted (a pagamento) e un job
  # saltato (`if: false`) darebbe un check "skipping" che blocca il merge.
  # Per riattivarli: runner self-hosted Linux/Windows e recupero dei job dalla git history
  # (versione di ci.yml precedente al commit "ci: rimuove i job linux e windows").

  apple:
    # Same self-hosted Mac as key-vault-password-manager; Flutter comes from the
    # runner's PATH (~/fvm/versions/stable), no flutter-action.
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr && format('refs/pull/{0}/merge', inputs.pr) || '' }}
          fetch-depth: 2
      - name: PR commit
        env:
          PR: ${{ inputs.pr }}
          SHA: ${{ inputs.sha }}
        run: |
          test -z "$SHA" || test "$SHA" = "$GITHUB_SHA" || { echo "::error::branch moved past the reviewed $SHA"; exit 1; }
          case "$PR" in ''|0) ;; *) test "$(git rev-parse HEAD^2)" = "$GITHUB_SHA" \
            || { echo "::error::refs/pull/$PR/merge does not merge $GITHUB_SHA"; exit 1; } ;; esac
      - name: Flutter matches .fvmrc
        run: |
          want=$(sed -n 's/.*"flutter"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .fvmrc)
          have=$(flutter --version | sed -n 's/^Flutter \([^ ]*\).*/\1/p')
          test "$want" = "$have" || { echo "Flutter $have on runner, $want pinned"; exit 1; }
      - run: flutter pub get
      - name: Codegen
        run: |
          dart run routefly
          dart run slang
          dart run build_runner build
      - name: Generated code is committed
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
      # Goldens are compared only on macOS, where they are recorded.
      - run: flutter test test/design_system
      # Text contrast on the list and the Conversazione needs the real fonts too (#55).
      - run: flutter test test/features/posta/screen_reader_test.dart
      - run: flutter build macos --debug
      - run: flutter build ios --no-codesign
