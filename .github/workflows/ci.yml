name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Runner hosted (repo pubblico: minuti macOS gratis). Il Mac self-hosted resta solo per la release e la firma.
# Una run superata di una PR non serve: la nuova la cancella.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Build nativa solo se serve (camillobucciarelli/officina#1): `android`, `apple`, `linux` e `windows` girano se la PR tocca codice
  # nativo, dipendenze o questo workflow. Su main e a mano girano sempre. Un errore solo di build nativa in una PR
  # di solo Dart esce quindi su main, non nella PR.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.native.outputs.native }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # In una PR il checkout è il merge commit: il primo genitore è la base.
      - id: native
        env:
          EVENT: ${{ github.event_name }}
        run: |
          native=true
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only HEAD^1 HEAD)
            echo "$files"
            grep -qE '^(android|ios|macos|linux|windows)/|^packages/|^pubspec\.(yaml|lock)$|^\.fvmrc$|^\.github/workflows/ci\.yml$|^tool/release/(battery_permission_check|store_bundle_check|windows_runtime_check)\.sh$' <<< "$files" || native=false
          fi
          echo "native=$native" | tee -a "$GITHUB_OUTPUT"

  # Al massimo 5 job macOS hosted insieme (limite di GitHub): static, 3 x test, apple. Android gira su Linux.
  static:
    # macOS: alcuni test di tool/release usano strumenti Apple (security, PlistBuddy).
    runs-on: macos-26
    # Misurato su hosted (#389): circa 8 minuti.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # Versione da .fvmrc, unica fonte; la action rifiuta anche flutter-version.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
          pub-cache: true
      - run: flutter pub get
      - name: Codegen
        run: |
          dart run routefly
          dart run slang
          dart run build_runner build
      - name: Generated code is committed
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
      # Generated files stay as the generators emit them.
      - name: Format
        run: |
          git ls-files -- 'lib/*.dart' 'test/*.dart' 'integration_test/*.dart' \
            | grep -vE '\.(g|freezed|config|route)\.dart$' \
            | xargs dart format --output=none --set-exit-if-changed
      - run: flutter analyze --fatal-infos
      # Motore HTML (#383): i test Dart compilano la libreria nativa per macOS; stack_test.sh verifica che i limiti
      # di annidamento reggano su 256 KB di stack (ADR 0025). Le build android e apple la compilano per l'app.
      - name: litehtml_flutter
        working-directory: packages/litehtml_flutter
        run: |
          flutter pub get
          git ls-files -- 'lib/*.dart' 'test/*.dart' 'hook/*.dart' | xargs dart format --output=none --set-exit-if-changed
          flutter test
          test/native/stack_test.sh
      - run: tool/release/version_test.sh
      - run: tool/release/verify_apk_test.sh
      - run: tool/release/battery_permission_check_test.sh
      - run: tool/release/verify_aab_test.sh
      - run: tool/release/play_upload_test.sh
      - run: tool/release/build_number_test.sh
      - run: tool/release/version_json_test.sh
      - run: tool/release/app_store_url_test.sh
      - run: tool/release/appcast_test.sh
      - run: tool/release/r2_unreleased_test.sh
      - run: tool/release/highest_version_test.sh
      - run: tool/release/ios_export_options_test.sh
      - run: tool/release/testflight_upload_test.sh
      - run: tool/release/guide_check_test.sh
      - run: tool/release/download_check_test.sh
      - run: tool/release/entitlements_check_test.sh
      - run: tool/release/store_bundle_check_test.sh
      - run: tool/release/profile_check_test.sh
      - run: tool/release/verify_store_test.sh
      - run: tool/release/readable_check_test.sh
      - run: tool/release/keychain_create_test.sh
      - run: tool/release/play_key_export_test.sh
      - run: tool/release/windows_runtime_check_test.sh

  # `flutter test` intero su un runner hosted macOS (3 core) dura 29 minuti (#389): diviso in parti parallele.
  # Il codice generato è nel repository (`static` lo verifica), quindi qui il codegen non serve.
  # I golden e il contrasto del testo (#55) si confrontano qui: girano solo su macOS, e `runs-on` deve restare
  # l'immagine che registra i golden (update-goldens.yml).
  test:
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # Versione da .fvmrc, unica fonte; la action rifiuta anche flutter-version.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
          pub-cache: true
      - run: flutter pub get
      # I test `imap` avviano da soli GreenMail (jar fissato e verificato, scaricato in .dart_tool/greenmail): con
      # POSTINO_REQUIRE_IMAP_SERVER=1 un Java mancante fa fallire il job invece di saltare i test.
      - name: flutter test
        env:
          POSTINO_REQUIRE_IMAP_SERVER: '1'
        run: flutter test --total-shards 3 --shard-index ${{ matrix.shard }}

  # Il check richiesto dal ruleset: verde solo se `changes`, `static` e tutte le parti di `test` sono verdi.
  # `changes` è qui perché, se fallisce, `android` e `apple` vengono saltati e un job saltato vale come verde.
  check:
    if: always()
    needs: [changes, static, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "changes, static, test: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done

  android:
    # Linux: più core dei runner macOS hosted, e non occupa uno dei 5 posti macOS.
    # JDK da setup-java; Android SDK dell'immagine hosted (ANDROID_HOME).
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      # Versione da .fvmrc, unica fonte; la action rifiuta anche flutter-version.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
          pub-cache: true
      - run: flutter pub get
      # Niente codegen: il codice generato è nel repository e `static` lo verifica.
      # Both flavors (#345, ADR 0023): the APK from the site keeps the one-tap battery dialog, Google Play's does not.
      - run: flutter build apk --debug --flavor site
      - run: flutter build apk --debug --flavor store
      - run: tool/release/battery_permission_check.sh build/app/outputs/flutter-apk/app-site-debug.apk site
      - run: tool/release/battery_permission_check.sh build/app/outputs/flutter-apk/app-store-debug.apk store
      # Never the debug keys on Play: without the upload key the store release stops at preStoreReleaseBuild, before
      # compiling. Its message, not only a failure, so a build broken for another reason does not pass here.
      - name: A store release without the upload key fails
        run: |
          if out=$(env -u ANDROID_KEYSTORE_PATH flutter build apk --release --flavor store 2>&1); then
            echo "::error::The store release was built without the upload key"; exit 1
          fi
          grep -q 'A store release needs the upload key' <<< "$out" || { echo "$out"; exit 1; }

  # `linux` e `windows` (#383) compilano il motore HTML nativo (packages/litehtml_flutter) con gcc/clang e MSVC e
  # l'app desktop. Non sono check richiesti. Come `android` e `apple`, girano solo se la PR tocca codice nativo.
  # Flutter da flutter-action alla versione di .fvmrc; il codice generato è committato (lo verifica `static`),
  # quindi niente codegen.
  linux:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - id: fvm
        name: Flutter version from .fvmrc
        run: echo "version=$(sed -n 's/.*"flutter"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true
      - name: Linux build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libx11-dev libxi-dev liblzma-dev \
            libsecret-1-dev libjsoncpp-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libnotify-dev
      - run: flutter pub get
      # I test Dart caricano la libreria nativa compilata qui (un documento litehtml aperto, disegnato e liberato).
      # Su x86_64 il caso peggiore (126 flex annidati) supera 256 KB di stack e sta in 384 KB (ADR 0025); su Linux
      # i thread, quello dell'isolate UI compreso, hanno di default 8 MB di stack (glibc).
      - name: litehtml_flutter
        working-directory: packages/litehtml_flutter
        run: |
          flutter pub get
          flutter test
          STACK_KB=384 test/native/stack_test.sh
      - run: flutter build linux --release

  windows:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - id: fvm
        name: Flutter version from .fvmrc
        run: echo "version=$(sed -n 's/.*"flutter"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true
      - run: flutter pub get
      # I test Dart caricano la libreria nativa compilata con MSVC. stack_test.sh no: è uno script clang con pthread.
      - name: litehtml_flutter
        working-directory: packages/litehtml_flutter
        run: |
          flutter pub get
          flutter test
      - run: flutter build windows --release
      # Il runtime Visual C++ sta accanto all'exe: sul runner è installato, su un PC qualsiasi no.
      - run: tool/release/windows_runtime_check.sh build/windows/x64/runner/Release

  apple:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-26
    # Misurato su hosted (#389): 15 minuti per le tre build.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # Versione da .fvmrc, unica fonte; la action rifiuta anche flutter-version.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
          pub-cache: true
      - run: flutter pub get
      # Niente codegen: il codice generato è nel repository e `static` lo verifica.
      - run: flutter build macos --debug
      # The Mac App Store variant (#325, ADR 0021): its own Xcode target, so a Swift file added to the Runner only, or
      # Sparkle slipping back in, fails here and not at release time.
      - run: flutter build macos --release --flavor store
      - run: tool/release/store_bundle_check.sh build/macos/Build/Products/Release-store/Postino.app
      - run: flutter build ios --no-codesign
