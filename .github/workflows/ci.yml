name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Una sola runner self-hosted: le run superate di una PR non devono accodarsi.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Self-hosted Mac (come apple): Flutter dal PATH del runner, niente flutter-action.
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      # Una PR da fork fallisce qui, prima di eseguire il suo codice: un job saltato darebbe un check richiesto verde.
      - name: PR from this repository
        if: github.event_name == 'pull_request'
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: test "$HEAD_REPO" = "$REPO" || { echo "::error::PR from a fork ($HEAD_REPO) not built"; exit 1; }
      - uses: actions/checkout@v7
      - name: Flutter matches .fvmrc
        run: |
          want=$(sed -n 's/.*"flutter"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .fvmrc)
          have=$(flutter --version | sed -n 's/^Flutter \([^ ]*\).*/\1/p')
          test "$want" = "$have" || { echo "Flutter $have on runner, $want pinned"; exit 1; }
      - run: flutter pub get
      - name: Codegen
        run: |
          dart run routefly
          dart run slang
          dart run build_runner build
      - name: Generated code is committed
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
      # Generated files stay as the generators emit them.
      - name: Format
        run: |
          git ls-files -- 'lib/*.dart' 'test/*.dart' 'integration_test/*.dart' \
            | grep -vE '\.(g|freezed|config|route)\.dart$' \
            | xargs dart format --output=none --set-exit-if-changed
      - run: flutter analyze --fatal-infos
      # I test `imap` avviano da soli GreenMail (jar fissato e verificato, scaricato in .dart_tool/greenmail): con
      # POSTINO_REQUIRE_IMAP_SERVER=1 un Java mancante fa fallire il job invece di saltare i test.
      - name: flutter test
        env:
          POSTINO_REQUIRE_IMAP_SERVER: '1'
        run: flutter test
      # Motore HTML (#383): i test Dart compilano la libreria nativa per macOS; stack_test.sh verifica che i limiti
      # di annidamento reggano su 256 KB di stack (ADR 0025). Le build android e apple la compilano per l'app.
      - name: litehtml_flutter
        working-directory: packages/litehtml_flutter
        run: |
          flutter pub get
          git ls-files -- 'lib/*.dart' 'test/*.dart' 'hook/*.dart' | xargs dart format --output=none --set-exit-if-changed
          flutter test
          test/native/stack_test.sh
      - run: tool/release/version_test.sh
      - run: tool/release/verify_apk_test.sh
      - run: tool/release/battery_permission_check_test.sh
      - run: tool/release/verify_aab_test.sh
      - run: tool/release/play_upload_test.sh
      - run: tool/release/build_number_test.sh
      - run: tool/release/version_json_test.sh
      - run: tool/release/app_store_url_test.sh
      - run: tool/release/appcast_test.sh
      - run: tool/release/r2_unreleased_test.sh
      - run: tool/release/highest_version_test.sh
      - run: tool/release/ios_export_options_test.sh
      - run: tool/release/testflight_upload_test.sh
      - run: tool/release/guide_check_test.sh
      - run: tool/release/download_check_test.sh
      - run: tool/release/entitlements_check_test.sh
      - run: tool/release/store_bundle_check_test.sh
      - run: tool/release/profile_check_test.sh
      - run: tool/release/verify_store_test.sh
      - run: tool/release/readable_check_test.sh
      - run: tool/release/keychain_create_test.sh
      - run: tool/release/play_key_export_test.sh

  android:
    # JDK: quello di Android Studio, trovato da Flutter; ANDROID_HOME sul runner.
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      # Una PR da fork fallisce qui, prima di eseguire il suo codice: un job saltato darebbe un check richiesto verde.
      - name: PR from this repository
        if: github.event_name == 'pull_request'
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: test "$HEAD_REPO" = "$REPO" || { echo "::error::PR from a fork ($HEAD_REPO) not built"; exit 1; }
      - uses: actions/checkout@v7
      - name: Flutter matches .fvmrc
        run: |
          want=$(sed -n 's/.*"flutter"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .fvmrc)
          have=$(flutter --version | sed -n 's/^Flutter \([^ ]*\).*/\1/p')
          test "$want" = "$have" || { echo "Flutter $have on runner, $want pinned"; exit 1; }
      - run: flutter pub get
      - name: Codegen
        run: |
          dart run routefly
          dart run slang
          dart run build_runner build
      # Both flavors (#345, ADR 0023): the APK from the site keeps the one-tap battery dialog, Google Play's does not.
      - run: flutter build apk --debug --flavor site
      - run: flutter build apk --debug --flavor store
      - run: tool/release/battery_permission_check.sh build/app/outputs/flutter-apk/app-site-debug.apk site
      - run: tool/release/battery_permission_check.sh build/app/outputs/flutter-apk/app-store-debug.apk store
      # Never the debug keys on Play: without the upload key the store release stops at preStoreReleaseBuild, before
      # compiling. Its message, not only a failure, so a build broken for another reason does not pass here.
      - name: A store release without the upload key fails
        run: |
          if out=$(env -u ANDROID_KEYSTORE_PATH flutter build apk --release --flavor store 2>&1); then
            echo "::error::The store release was built without the upload key"; exit 1
          fi
          grep -q 'A store release needs the upload key' <<< "$out" || { echo "$out"; exit 1; }

  # Eccezione al runner self-hosted (#383): `linux` e `windows` girano su runner GitHub-hosted (il repository è
  # pubblico) per compilare il motore HTML nativo (packages/litehtml_flutter) con gcc/clang e MSVC e l'app desktop.
  # Non sono check richiesti. Flutter da flutter-action alla versione di .fvmrc; il codice generato è committato (lo
  # verifica `check`), quindi niente codegen.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Una PR da fork fallisce qui, prima di eseguire il suo codice, come negli altri job.
      - name: PR from this repository
        if: github.event_name == 'pull_request'
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: test "$HEAD_REPO" = "$REPO" || { echo "::error::PR from a fork ($HEAD_REPO) not built"; exit 1; }
      - uses: actions/checkout@v7
      - id: fvm
        name: Flutter version from .fvmrc
        run: echo "version=$(sed -n 's/.*"flutter"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true
      - name: Linux build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libx11-dev libxi-dev liblzma-dev \
            libsecret-1-dev libjsoncpp-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libnotify-dev
      - run: flutter pub get
      # I test Dart caricano la libreria nativa compilata qui (un documento litehtml aperto, disegnato e liberato).
      # Su x86_64 il caso peggiore (126 flex annidati) supera 256 KB di stack e sta in 384 KB (ADR 0025); su Linux
      # i thread, quello dell'isolate UI compreso, hanno di default 8 MB di stack (glibc).
      - name: litehtml_flutter
        working-directory: packages/litehtml_flutter
        run: |
          flutter pub get
          flutter test
          STACK_KB=384 test/native/stack_test.sh
      - run: flutter build linux --release

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      # Una PR da fork fallisce qui, prima di eseguire il suo codice, come negli altri job.
      - name: PR from this repository
        if: github.event_name == 'pull_request'
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: test "$HEAD_REPO" = "$REPO" || { echo "::error::PR from a fork ($HEAD_REPO) not built"; exit 1; }
      - uses: actions/checkout@v7
      - id: fvm
        name: Flutter version from .fvmrc
        run: echo "version=$(sed -n 's/.*"flutter"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true
      - run: flutter pub get
      # I test Dart caricano la libreria nativa compilata con MSVC. stack_test.sh no: è uno script clang con pthread.
      - name: litehtml_flutter
        working-directory: packages/litehtml_flutter
        run: |
          flutter pub get
          flutter test
      - run: flutter build windows --release

  apple:
    # Same self-hosted Mac as key-vault-password-manager; Flutter comes from the
    # runner's PATH (~/fvm/versions/stable), no flutter-action.
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      # Una PR da fork fallisce qui, prima di eseguire il suo codice: un job saltato darebbe un check richiesto verde.
      - name: PR from this repository
        if: github.event_name == 'pull_request'
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: test "$HEAD_REPO" = "$REPO" || { echo "::error::PR from a fork ($HEAD_REPO) not built"; exit 1; }
      - uses: actions/checkout@v7
      - name: Flutter matches .fvmrc
        run: |
          want=$(sed -n 's/.*"flutter"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .fvmrc)
          have=$(flutter --version | sed -n 's/^Flutter \([^ ]*\).*/\1/p')
          test "$want" = "$have" || { echo "Flutter $have on runner, $want pinned"; exit 1; }
      - run: flutter pub get
      - name: Codegen
        run: |
          dart run routefly
          dart run slang
          dart run build_runner build
      - name: Generated code is committed
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
      # Goldens are compared only on macOS, where they are recorded.
      - run: flutter test test/design_system
      # Text contrast on the list and the Conversazione needs the real fonts too (#55).
      - run: flutter test test/features/posta/screen_reader_test.dart
      - run: flutter build macos --debug
      # The Mac App Store variant (#325, ADR 0021): its own Xcode target, so a Swift file added to the Runner only, or
      # Sparkle slipping back in, fails here and not at release time.
      - run: flutter build macos --release --flavor store
      - run: tool/release/store_bundle_check.sh build/macos/Build/Products/Release-store/Postino.app
      - run: flutter build ios --no-codesign
