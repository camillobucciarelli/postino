name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Codegen
        run: |
          dart run routefly
          # slang outputs are committed and build_runner 2.16 refuses to overwrite them
          # ("Asset already exists"); regenerate from scratch, the diff check below catches drift.
          rm lib/i18n/strings*.g.dart
          dart run build_runner build
      - name: Generated code is committed
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - run: flutter analyze
      - run: flutter test
