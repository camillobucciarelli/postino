name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Runner hosted (repo pubblico: minuti macOS gratis). Il Mac self-hosted resta solo per la release e la firma.
# Una run superata di una PR non serve: la nuova la cancella.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # macOS: alcuni test di tool/release usano strumenti Apple (security, PlistBuddy).
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # Versione da .fvmrc, unica fonte; la action rifiuta anche flutter-version.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
          pub-cache: true
      - run: flutter pub get
      - name: Codegen
        run: |
          dart run routefly
          dart run slang
          dart run build_runner build
      - name: Generated code is committed
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
      # Generated files stay as the generators emit them.
      - name: Format
        run: |
          git ls-files -- 'lib/*.dart' 'test/*.dart' 'integration_test/*.dart' \
            | grep -vE '\.(g|freezed|config|route)\.dart$' \
            | xargs dart format --output=none --set-exit-if-changed
      - run: flutter analyze --fatal-infos
      # I test `imap` avviano da soli GreenMail (jar fissato e verificato, scaricato in .dart_tool/greenmail): con
      # POSTINO_REQUIRE_IMAP_SERVER=1 un Java mancante fa fallire il job invece di saltare i test.
      - name: flutter test
        env:
          POSTINO_REQUIRE_IMAP_SERVER: '1'
        run: flutter test
      - run: tool/release/version_test.sh
      - run: tool/release/verify_apk_test.sh
      - run: tool/release/battery_permission_check_test.sh
      - run: tool/release/verify_aab_test.sh
      - run: tool/release/play_upload_test.sh
      - run: tool/release/build_number_test.sh
      - run: tool/release/version_json_test.sh
      - run: tool/release/app_store_url_test.sh
      - run: tool/release/appcast_test.sh
      - run: tool/release/r2_unreleased_test.sh
      - run: tool/release/highest_version_test.sh
      - run: tool/release/ios_export_options_test.sh
      - run: tool/release/testflight_upload_test.sh
      - run: tool/release/guide_check_test.sh
      - run: tool/release/download_check_test.sh
      - run: tool/release/entitlements_check_test.sh
      - run: tool/release/store_bundle_check_test.sh
      - run: tool/release/profile_check_test.sh
      - run: tool/release/verify_store_test.sh
      - run: tool/release/readable_check_test.sh
      - run: tool/release/keychain_create_test.sh
      - run: tool/release/play_key_export_test.sh

  android:
    # JDK da setup-java; Android SDK dell'immagine hosted (ANDROID_HOME).
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # Versione da .fvmrc, unica fonte; la action rifiuta anche flutter-version.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
          pub-cache: true
      - run: flutter pub get
      - name: Codegen
        run: |
          dart run routefly
          dart run slang
          dart run build_runner build
      # Both flavors (#345, ADR 0023): the APK from the site keeps the one-tap battery dialog, Google Play's does not.
      - run: flutter build apk --debug --flavor site
      - run: flutter build apk --debug --flavor store
      - run: tool/release/battery_permission_check.sh build/app/outputs/flutter-apk/app-site-debug.apk site
      - run: tool/release/battery_permission_check.sh build/app/outputs/flutter-apk/app-store-debug.apk store
      # Never the debug keys on Play: without the upload key the store release stops at preStoreReleaseBuild, before
      # compiling. Its message, not only a failure, so a build broken for another reason does not pass here.
      - name: A store release without the upload key fails
        run: |
          if out=$(env -u ANDROID_KEYSTORE_PATH flutter build apk --release --flavor store 2>&1); then
            echo "::error::The store release was built without the upload key"; exit 1
          fi
          grep -q 'A store release needs the upload key' <<< "$out" || { echo "$out"; exit 1; }

  # Job `linux` e `windows` rimossi. Con il repo pubblico i minuti hosted sono gratis: il ritorno
  # è deciso in camillobucciarelli/officina#8. I job sono nella git history
  # (versione di ci.yml precedente al commit "ci: rimuove i job linux e windows").

  apple:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      # Versione da .fvmrc, unica fonte; la action rifiuta anche flutter-version.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
          pub-cache: true
      - run: flutter pub get
      - name: Codegen
        run: |
          dart run routefly
          dart run slang
          dart run build_runner build
      - name: Generated code is committed
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
      # Goldens are compared only on macOS, where they are recorded.
      - run: flutter test test/design_system
      # Text contrast on the list and the Conversazione needs the real fonts too (#55).
      - run: flutter test test/features/posta/screen_reader_test.dart
      - run: flutter build macos --debug
      # The Mac App Store variant (#325, ADR 0021): its own Xcode target, so a Swift file added to the Runner only, or
      # Sparkle slipping back in, fails here and not at release time.
      - run: flutter build macos --release --flavor store
      - run: tool/release/store_bundle_check.sh build/macos/Build/Products/Release-store/Postino.app
      - run: flutter build ios --no-codesign
