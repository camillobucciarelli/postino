name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Single source of truth for the pinned Flutter version: .fvmrc.
          # Do not add `flutter-version:` alongside it, the action rejects both.
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter pub get
      - name: Codegen
        run: |
          dart run routefly
          dart run slang
          dart run build_runner build
      # routefly numbers routes in directory-listing order, which differs on
      # Linux; lib/main.route.dart and lib/main.g.dart are checked on macOS (apple job) instead.
      - name: Generated code is committed
        run: |
          git diff --exit-code -- . ':!lib/main.route.dart' ':!lib/main.g.dart'
          test -z "$(git status --porcelain -- . ':!lib/main.route.dart' ':!lib/main.g.dart')"
      - run: flutter analyze
      - run: flutter test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: flutter pub get
      - name: Codegen
        run: |
          dart run routefly
          dart run slang
          dart run build_runner build
      - run: flutter build apk --debug

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
      - name: Linux build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev libwebkit2gtk-4.1-dev
      - run: flutter pub get
      - name: Codegen
        run: |
          dart run routefly
          dart run slang
          dart run build_runner build
      - run: flutter build linux

  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter pub get
      - name: Codegen
        run: |
          dart run routefly
          dart run slang
          dart run build_runner build
      - run: flutter build windows

  apple:
    # Same self-hosted Mac as key-vault-password-manager; Flutter comes from the
    # runner's PATH (~/fvm/versions/stable), no flutter-action.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Flutter matches .fvmrc
        run: |
          want=$(sed -n 's/.*"flutter"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .fvmrc)
          have=$(flutter --version | sed -n 's/^Flutter \([^ ]*\).*/\1/p')
          test "$want" = "$have" || { echo "Flutter $have on runner, $want pinned"; exit 1; }
      - run: flutter pub get
      - name: Codegen
        run: |
          dart run routefly
          dart run slang
          dart run build_runner build
      - name: Generated code is committed
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
      # Goldens are compared only on macOS, where they are recorded.
      - run: flutter test test/design_system
      - run: flutter build macos --debug
      - run: flutter build ios --no-codesign
