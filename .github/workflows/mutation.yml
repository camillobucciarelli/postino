name: Mutation

# Mutation test a mano (docs/agents/mutation-test.md): tutta lib/ o i percorsi in `path`. Sulle PR gira il job
# `mutation` di ci.yml, solo sui file modificati.
on:
  workflow_dispatch:
    inputs:
      path:
        description: 'Percorsi da mutare, separati da virgola (es. lib/core/domain/)'
        default: 'lib/'
      max-mutants:
        description: 'Tetto ai mutanti, campionati in modo deterministico (0 = tutti)'
        default: '0'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  mutation:
    runs-on: [self-hosted, macOS, ARM64]
    # Tutta lib/ dura ~5 ore (stima in docs/agents/mutation-test.md).
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
      - name: Flutter matches .fvmrc
        run: |
          want=$(sed -n 's/.*"flutter"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .fvmrc)
          have=$(flutter --version | sed -n 's/^Flutter \([^ ]*\).*/\1/p')
          test "$want" = "$have" || { echo "Flutter $have on runner, $want pinned"; exit 1; }
      - run: flutter pub get
      - name: Mutation test
        env:
          TARGET: ${{ inputs.path }}
          MAX_MUTANTS: ${{ inputs.max-mutants }}
        run: dart run tool/mutation/run.dart --path="$TARGET" --max-mutants="$MAX_MUTANTS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: build/mutation/
          if-no-files-found: ignore
