name: Release

# A vX.Y.Z tag (or a manual run, from main only) publishes the version in pubspec.yaml. One job per platform, each
# `needs: version`: `macos` (DMG), `macos-store` (Mac App Store, #325, off until configured), `android` (sideloaded
# APK) and `ios` (TestFlight, #120). `site` publishes the
# invitees' guide (#123) and the website's static files, `download` the product page (#173, after `macos` and
# `android`) next to them.
# Steps live in tool/release/*.sh, one responsibility each.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

# One self-hosted runner: never cancel a release halfway (a notarization may already be submitted).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: [self-hosted, macOS, ARM64]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Release ref (tag or main) and version from pubspec.yaml
        run: |
          version=$(tool/release/version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: A manual run never replaces a released version
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag=$(git ls-remote --tags origin "refs/tags/v$VERSION")
          test -z "$tag" || { echo "::error::v$VERSION is already released: bump the version in pubspec.yaml"; exit 1; }

  # The invitees' guide (#123), hand-written HTML twin of docs/guida-invitati.md, at a stable URL. R2's custom domain
  # serves no directory index, so the stable link is guida/index.html. A tag moves it only when it is the highest
  # version, like the "latest" downloads; a manual run (from main) always publishes it. No `needs: version`: a manual
  # run of an already released version stops there (and so do the platform jobs), while the guide still goes out, so
  # a fix to the guide alone needs no new version. With it go the website's files that name no version (docs/download,
  # checked by download_check.sh, and the brand icons): fonts and icons first, then style.css (the guide's too), then
  # the privacy pages. R2 serves no directory index, so every link names its file (privacy.html, en/index.html).
  # en/privacy.html links to en/index.html, which only `download` publishes: a manual run that stops at `version`
  # before the first release with this site leaves that link dangling until the release.
  site:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: tool/release/guide_check.sh
      - run: tool/release/download_check.sh
      - name: Upload the guide and the website's static files to R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          RELEASE_BASE_URL: ${{ vars.RELEASE_BASE_URL }}
        run: |
          # version.sh refuses a mismatched tag or a manual run off main. Own assignments, so a failing
          # version.sh or is_latest.sh fails the step instead of skipping the check.
          version=$(tool/release/version.sh)
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            latest=$(tool/release/is_latest.sh "$version")
            if [ "$latest" != yes ]; then
              echo "v$version is not the highest version: guide left as it is"
              exit 0
            fi
          fi
          upload() { tool/release/r2_upload.sh "docs/download/$1" "$1" "$2" "${3:-public, max-age=300}"; }
          # A font never changes under the same name (style.css says so): a year of cache.
          for font in docs/download/fonts/*.woff2; do
            upload "fonts/${font##*/}" font/woff2 'public, max-age=31536000, immutable'
          done
          for license in docs/download/fonts/*-OFL.txt; do upload "fonts/${license##*/}" 'text/plain; charset=utf-8'; done
          # Logo and favicon straight from the brand sources (docs/brand-icone.md), no copy in docs/download.
          for icon in icon.svg icon-small.svg; do
            tool/release/r2_upload.sh "assets/brand/$icon" "brand/$icon" image/svg+xml 'public, max-age=300'
          done
          # The Open Graph image the product pages name (generated by tool/brand_icons.sh).
          upload og.png image/png
          upload style.css 'text/css; charset=utf-8'
          upload privacy.html 'text/html; charset=utf-8'
          upload en/privacy.html 'text/html; charset=utf-8'
          upload support.html 'text/html; charset=utf-8'
          upload en/support.html 'text/html; charset=utf-8'
          tool/release/r2_upload.sh docs/guida-invitati/index.html guida/index.html 'text/html; charset=utf-8' 'public, max-age=300'
          echo "- Privacy: ${RELEASE_BASE_URL:+${RELEASE_BASE_URL%/}/}privacy.html" >> "$GITHUB_STEP_SUMMARY"
          echo "- Support: ${RELEASE_BASE_URL:+${RELEASE_BASE_URL%/}/}support.html" >> "$GITHUB_STEP_SUMMARY"
          echo "- Guida: ${RELEASE_BASE_URL:+${RELEASE_BASE_URL%/}/}guida/index.html" >> "$GITHUB_STEP_SUMMARY"

  # The product page (#173) goes up as index.html at the bucket root and en/index.html, with __VERSION__ replaced; its
  # stylesheet, fonts and privacy pages come from `site`, so it waits for that too (`site` succeeds, doing nothing, on
  # a tag that is not the highest). It waits for `macos` and `android` (a skipped or failed job skips this one), so it never names a version whose files are not up yet nor moves the "latest" links ahead of them.
  # Its main buttons point to the versioned files of this very run: a manual run publishes those but never moves
  # "latest" (only tag pushes do), so the "latest" links are only the secondary ones. The root `/` itself is served by a
  # Cloudflare Transform Rule (Rewrite URL: path exactly `/` -> static `/index.html`), set by hand by the owner in the
  # dashboard, outside this repo: without it only /index.html works.
  download:
    needs: [version, macos, android, site]
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: tool/release/download_check.sh
      - name: Upload the download page to R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          RELEASE_BASE_URL: ${{ vars.RELEASE_BASE_URL }}
        run: |
          version=$(tool/release/version.sh)
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            latest=$(tool/release/is_latest.sh "$version")
            if [ "$latest" != yes ]; then
              echo "v$version is not the highest version: download page left as it is"
              exit 0
            fi
          fi
          for page in index.html en/index.html; do
            mkdir -p "build/site/$(dirname "$page")"
            sed "s/__VERSION__/$version/g" "docs/download/$page" > "build/site/$page"
            tool/release/r2_upload.sh "build/site/$page" "$page" 'text/html; charset=utf-8' 'public, max-age=300'
            echo "- Download: ${RELEASE_BASE_URL:+${RELEASE_BASE_URL%/}/}$page" >> "$GITHUB_STEP_SUMMARY"
          done

  macos:
    needs: version
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.version.outputs.version }}
      APP: build/macos/Build/Products/Release/Postino.app
      DMG: build/release/Postino-${{ needs.version.outputs.version }}.dmg
    steps:
      # Without GOOGLE_CLIENT_ID or MICROSOFT_CLIENT_ID the app builds fine but no Gmail or Outlook.com Account can
      # connect (README, "Client OAuth di Google" and "Client OAuth di Microsoft"); without SPARKLE_ED_PRIVATE_KEY no
      # appcast can be signed (#122); without MACOS_PROVISION_PROFILE_BASE64 the app cannot use the Data Protection
      # keychain that holds the database key (#270): all stop the job before any build.
      - name: Required secrets are set
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          MACOS_PROVISION_PROFILE_BASE64: ${{ secrets.MACOS_PROVISION_PROFILE_BASE64 }}
        run: |
          missing=0
          for name in GOOGLE_CLIENT_ID MICROSOFT_CLIENT_ID SPARKLE_ED_PRIVATE_KEY MACOS_PROVISION_PROFILE_BASE64; do
            test -n "${!name}" || { echo "::error::Secret $name is not set"; missing=1; }
          done
          exit "$missing"
      - uses: actions/checkout@v4
      # A tag release is final (immutable cache, appcast signature): a rerun never overwrites it, before any build.
      - name: No tag release of this version yet
        if: github.event_name == 'push'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: tool/release/r2_unreleased.sh "macos/$VERSION/Postino-$VERSION.dmg"
      - name: Flutter matches .fvmrc
        run: |
          want=$(sed -n 's/.*"flutter"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .fvmrc)
          have=$(flutter --version | sed -n 's/^Flutter \([^ ]*\).*/\1/p')
          test "$want" = "$have" || { echo "Flutter $have on runner, $want pinned"; exit 1; }
      # Generated code is committed (checked by ci.yml), so no codegen here.
      # macOS uses the iOS-type client: ID only, no GOOGLE_CLIENT_SECRET (README).
      # The build number (CFBundleVersion, what Sparkle compares) grows with the version: build_number.sh.
      - name: flutter build macos --release
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
        run: |
          build=$(tool/release/build_number.sh "$VERSION")
          flutter build macos --release --build-number="$build" --dart-define=GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
            --dart-define=MICROSOFT_CLIENT_ID="$MICROSOFT_CLIENT_ID" --dart-define=POSTINO_BUILD="$build" \
            --dart-define=POSTINO_VERSION="$VERSION"
      - name: Developer ID certificate in a job keychain
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: tool/release/keychain_create.sh
      # The Developer ID provisioning profile authorizes the app's keychain access group (#270); it ships inside the
      # app, so it is no secret once signed, but it is never printed.
      - name: Sign with the provisioning profile
        env:
          MACOS_PROVISION_PROFILE_BASE64: ${{ secrets.MACOS_PROVISION_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          export PROVISION_PROFILE="$RUNNER_TEMP/postino.provisionprofile"
          trap 'rm -f "$PROVISION_PROFILE"' EXIT
          (umask 077 && printf '%s' "$MACOS_PROVISION_PROFILE_BASE64" | base64 -D > "$PROVISION_PROFILE")
          tool/release/sign_app.sh "$APP"
      - name: Notarize and staple the app
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: tool/release/notarize.sh "$APP"
      - run: tool/release/make_dmg.sh "$APP" "$DMG"
      # Last use of the certificate: the keychain goes now, and even when an earlier step failed.
      - name: Delete the job keychain
        if: always()
        run: tool/release/keychain_delete.sh
      - name: Notarize and staple the DMG
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: tool/release/notarize.sh "$DMG"
      - run: tool/release/verify.sh "$APP" "$DMG"
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Every run signs it, so a wrong key fails a manual run too; only a tag release of the highest version
      # publishes it, below, after its DMG. The app's SUFeedURL (<base>/macos/appcast.xml) is what installed copies
      # poll: the DMG link is built from it, and a RELEASE_BASE_URL pointing elsewhere stops the job.
      - name: Signed Sparkle appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          RELEASE_BASE_URL: ${{ vars.RELEASE_BASE_URL }}
        run: |
          feed=$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$APP/Contents/Info.plist")
          base=${feed%/macos/appcast.xml}
          test "$base/macos/appcast.xml" = "$feed" || { echo "::error::SUFeedURL $feed is not <base>/macos/appcast.xml"; exit 1; }
          if [ -n "$RELEASE_BASE_URL" ] && [ "${RELEASE_BASE_URL%/}" != "$base" ]; then
            echo "::error::RELEASE_BASE_URL $RELEASE_BASE_URL is not the base of SUFeedURL $feed"
            exit 1
          fi
          tool/release/appcast.sh "$DMG" "$base/macos/$VERSION/" build/release/appcast.xml
      - name: Upload the DMG to R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          # Public base of the bucket (custom domain), a repository variable; optional.
          RELEASE_BASE_URL: ${{ vars.RELEASE_BASE_URL }}
        run: |
          upload() {
            tool/release/r2_upload.sh "$DMG" "$1" application/x-apple-diskimage "$2"
            echo "- macOS: ${RELEASE_BASE_URL:+${RELEASE_BASE_URL%/}/}$1" >> "$GITHUB_STEP_SUMMARY"
          }
          # A tag build is final; a manual build of the same version is replaced by its tag run, so short cache.
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            upload "macos/$VERSION/Postino-$VERSION.dmg" 'public, max-age=31536000, immutable'
            # Stable link for invitees: only a tag release of the highest version moves it.
            latest=$(tool/release/is_latest.sh "$VERSION")
            if [ "$latest" = yes ]; then
              upload macos/latest/Postino.dmg 'public, max-age=300'
              # Sparkle's feed (#122), after the DMG it points at: installed copies find this version.
              tool/release/r2_upload.sh build/release/appcast.xml macos/appcast.xml application/xml 'public, max-age=300'
              echo "- macOS appcast: ${RELEASE_BASE_URL:+${RELEASE_BASE_URL%/}/}macos/appcast.xml" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            upload "macos/$VERSION/Postino-$VERSION.dmg" 'public, max-age=300'
          fi

  # The Mac App Store variant (#325, ADR 0021): the Store target (`--flavor store`, no Sparkle), signed with Apple
  # Distribution and the Mac App Store profile, packaged as a .pkg signed with the Mac Installer certificate and uploaded
  # to App Store Connect (TestFlight for macOS, then review by hand). Off until the owner sets the repository variable
  # MAC_APP_STORE to true, once the secrets below exist: until then the job is skipped, not failed. Nothing waits for it,
  # so the DMG never depends on it. The build number is the other platforms'; App Store Connect refuses one it already
  # has, so a rerun of a released version fails at the upload, as on iOS.
  macos-store:
    needs: version
    if: vars.MAC_APP_STORE == 'true'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.version.outputs.version }}
      APP: build/macos/Build/Products/Release-store/Postino.app
      PKG: build/release/Postino-${{ needs.version.outputs.version }}.pkg
    steps:
      # MAS_CERTIFICATE_P12_BASE64 holds both identities, Apple Distribution and Mac Installer Distribution;
      # MAS_PROVISION_PROFILE_BASE64 is the Mac App Store profile of the app id, with the keychain access group (#270).
      - name: Required secrets are set
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MAS_CERTIFICATE_P12_BASE64: ${{ secrets.MAS_CERTIFICATE_P12_BASE64 }}
          MAS_CERTIFICATE_PASSWORD: ${{ secrets.MAS_CERTIFICATE_PASSWORD }}
          MAS_PROVISION_PROFILE_BASE64: ${{ secrets.MAS_PROVISION_PROFILE_BASE64 }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          missing=0
          for name in GOOGLE_CLIENT_ID MICROSOFT_CLIENT_ID APPLE_TEAM_ID MAS_CERTIFICATE_P12_BASE64 MAS_CERTIFICATE_PASSWORD \
            MAS_PROVISION_PROFILE_BASE64 APP_STORE_CONNECT_API_KEY_BASE64 APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID; do
            test -n "${!name}" || { echo "::error::Secret $name is not set"; missing=1; }
          done
          exit "$missing"
      - uses: actions/checkout@v4
      - name: Flutter matches .fvmrc
        run: |
          want=$(sed -n 's/.*"flutter"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .fvmrc)
          have=$(flutter --version | sed -n 's/^Flutter \([^ ]*\).*/\1/p')
          test "$want" = "$have" || { echo "Flutter $have on runner, $want pinned"; exit 1; }
      # As the DMG's build, with the Store flavor: the Store target, and appFlavor 'store' turns the updater off.
      - name: flutter build macos --release --flavor store
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
        run: |
          build=$(tool/release/build_number.sh "$VERSION")
          flutter build macos --release --flavor store --build-number="$build" \
            --dart-define=GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" --dart-define=MICROSOFT_CLIENT_ID="$MICROSOFT_CLIENT_ID" \
            --dart-define=POSTINO_BUILD="$build" --dart-define=POSTINO_VERSION="$VERSION"
      - run: tool/release/store_bundle_check.sh "$APP"
      - name: Mac App Store certificates in a job keychain
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MAS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MAS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SIGNING_CERTIFICATE: Apple Distribution|3rd Party Mac Developer Application
          INSTALLER_CERTIFICATE: 3rd Party Mac Developer Installer|Mac Installer Distribution
        run: tool/release/keychain_create.sh
      - name: Sign with the Mac App Store profile
        env:
          MAS_PROVISION_PROFILE_BASE64: ${{ secrets.MAS_PROVISION_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          export PROVISION_PROFILE="$RUNNER_TEMP/postino-mas.provisionprofile"
          trap 'rm -f "$PROVISION_PROFILE"' EXIT
          (umask 077 && printf '%s' "$MAS_PROVISION_PROFILE_BASE64" | base64 -D > "$PROVISION_PROFILE")
          tool/release/sign_app.sh "$APP"
      - name: Package the signed .pkg
        run: |
          mkdir -p "$(dirname "$PKG")"
          productbuild --component "$APP" /Applications --sign "$INSTALLER_IDENTITY" \
            --keychain "$RUNNER_TEMP/release.keychain-db" "$PKG"
      # Last use of the certificates: the keychain goes now, and even when an earlier step failed.
      - name: Delete the job keychain
        if: always()
        run: tool/release/keychain_delete.sh
      - run: tool/release/verify_store.sh "$APP" "$PKG"
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          tool/release/testflight_upload.sh "$PKG" macos
          echo "- Mac App Store: build $(tool/release/build_number.sh "$VERSION") of $VERSION uploaded to App Store Connect" >> "$GITHUB_STEP_SUMMARY"

  android:
    needs: version
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
      APK: build/app/outputs/flutter-apk/app-release.apk
      # Upload key certificate (public): verify_apk.sh refuses any other signer, the debug key included.
      ANDROID_CERT_SHA256: 47:03:4A:D7:65:75:3A:E5:27:8C:6C:09:F6:5E:E8:5F:E7:6B:26:56:85:9C:04:AC:78:54:2D:8A:8D:12:1F:04
    steps:
      # Before any build: a missing secret would otherwise surface late, or as an APK no Account can use.
      - name: Required secrets are set
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          missing=0
          for name in GOOGLE_CLIENT_ID MICROSOFT_CLIENT_ID ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ACCOUNT_ID R2_BUCKET; do
            test -n "${!name}" || { echo "::error::Secret $name is not set"; missing=1; }
          done
          exit "$missing"
      - uses: actions/checkout@v4
      # As for the DMG: a tag release is never overwritten.
      - name: No tag release of this version yet
        if: github.event_name == 'push'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: tool/release/r2_unreleased.sh "android/$VERSION/Postino-$VERSION.apk"
      - name: Flutter matches .fvmrc
        run: |
          want=$(sed -n 's/.*"flutter"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .fvmrc)
          have=$(flutter --version | sed -n 's/^Flutter \([^ ]*\).*/\1/p')
          test "$want" = "$have" || { echo "Flutter $have on runner, $want pinned"; exit 1; }
      - name: Upload keystore in RUNNER_TEMP
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: tool/release/android_keystore.sh
      # Generated code is committed (checked by ci.yml), so no codegen here. JDK and ANDROID_HOME come from the
      # runner, as in ci.yml's android job. Android uses the iOS-type client: ID only (README).
      - name: flutter build apk --release
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # versionCode grows with the version (build_number.sh), as the macOS build number; pubspec's "+1" is fixed.
          # POSTINO_BUILD is the same number for the app, which compares it with the site's version.json (#287).
          build=$(tool/release/build_number.sh "$VERSION")
          flutter build apk --release --build-number="$build" --dart-define=GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
            --dart-define=MICROSOFT_CLIENT_ID="$MICROSOFT_CLIENT_ID" --dart-define=POSTINO_BUILD="$build" \
            --dart-define=POSTINO_VERSION="$VERSION"
      # Last use of the keystore: it goes now, and even when an earlier step failed.
      - name: Delete the upload keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.p12"
      - run: tool/release/verify_apk.sh "$APK" "$ANDROID_CERT_SHA256" "$(tool/release/build_number.sh "$VERSION")" "$VERSION"
      - name: Upload the APK to R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          RELEASE_BASE_URL: ${{ vars.RELEASE_BASE_URL }}
        run: |
          echo "- Android APK sha256: \`$(shasum -a 256 "$APK" | cut -d ' ' -f 1)\`" >> "$GITHUB_STEP_SUMMARY"
          upload() {
            tool/release/r2_upload.sh "$APK" "$1" application/vnd.android.package-archive "$2"
            echo "- Android: ${RELEASE_BASE_URL:+${RELEASE_BASE_URL%/}/}$1" >> "$GITHUB_STEP_SUMMARY"
          }
          # Same cache policy as the DMG: a tag build is final, a manual build is replaced by its tag run.
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            upload "android/$VERSION/Postino-$VERSION.apk" 'public, max-age=31536000, immutable'
            latest=$(tool/release/is_latest.sh "$VERSION")
            if [ "$latest" = yes ]; then
              upload android/latest/Postino.apk 'public, max-age=300'
              # The version file installed copies read (#287), after the APK it points at.
              tool/release/version_json.sh "$VERSION" \
                "https://postino.camillobucciarelli.dev/android/$VERSION/Postino-$VERSION.apk" > "$RUNNER_TEMP/version.json"
              tool/release/r2_upload.sh "$RUNNER_TEMP/version.json" android/latest/version.json application/json 'public, max-age=300'
            fi
          else
            upload "android/$VERSION/Postino-$VERSION.apk" 'public, max-age=300'
          fi

  # TestFlight (#120): internal testers only (no Beta App Review). Signing is Xcode's own, cloud-managed through the
  # App Store Connect API key (tool/release/ios_ipa.sh): no certificate, profile or keychain secret exists. The build
  # number is the same as the other platforms'; App Store Connect refuses one it already has, so a rerun of a released
  # version fails at the upload (bump pubspec.yaml). Builds expire after 90 days: run this workflow by hand (with a
  # version bumped in pubspec.yaml) at least every ~80 days to keep testers on a live build.
  ios:
    needs: version
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Required secrets are set
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          missing=0
          for name in GOOGLE_CLIENT_ID MICROSOFT_CLIENT_ID APPLE_TEAM_ID APP_STORE_CONNECT_API_KEY_BASE64 APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID; do
            test -n "${!name}" || { echo "::error::Secret $name is not set"; missing=1; }
          done
          exit "$missing"
      - uses: actions/checkout@v4
      - name: Flutter matches .fvmrc
        run: |
          want=$(sed -n 's/.*"flutter"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .fvmrc)
          have=$(flutter --version | sed -n 's/^Flutter \([^ ]*\).*/\1/p')
          test "$want" = "$have" || { echo "Flutter $have on runner, $want pinned"; exit 1; }
      # Generated code is committed (checked by ci.yml), so no codegen here. --config-only writes version, build number
      # and dart-defines for the archive of ios_ipa.sh; iOS uses the iOS-type client: ID only (README).
      - name: Configure the iOS build
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
        run: |
          build=$(tool/release/build_number.sh "$VERSION")
          flutter build ios --config-only --release --build-number="$build" --dart-define=GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
            --dart-define=MICROSOFT_CLIENT_ID="$MICROSOFT_CLIENT_ID" --dart-define=POSTINO_BUILD="$build" \
            --dart-define=POSTINO_VERSION="$VERSION"
      - name: Archive and export the IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: tool/release/ios_ipa.sh build/release
      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          tool/release/testflight_upload.sh build/release/Postino.ipa
          echo "- iOS: build $(tool/release/build_number.sh "$VERSION") of $VERSION uploaded to TestFlight (internal testers)" >> "$GITHUB_STEP_SUMMARY"
      # No version file here (#323): the build is not on the App Store until it passes review and is released by
      # hand. ios-version-file.yml publishes it then.
