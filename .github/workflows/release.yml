name: Release

# A vX.Y.Z tag (or a manual run, from main only) publishes the version in pubspec.yaml. One job per platform, each
# `needs: version`: `macos` (DMG) and `android` (sideloaded APK); TestFlight (#120) plugs in as a sibling.
# Steps live in tool/release/*.sh, one responsibility each.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

# One self-hosted runner: never cancel a release halfway (a notarization may already be submitted).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: [self-hosted, macOS, ARM64]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Release ref (tag or main) and version from pubspec.yaml
        run: |
          version=$(tool/release/version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: A manual run never replaces a released version
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag=$(git ls-remote --tags origin "refs/tags/v$VERSION")
          test -z "$tag" || { echo "::error::v$VERSION is already released: bump the version in pubspec.yaml"; exit 1; }

  macos:
    needs: version
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.version.outputs.version }}
      APP: build/macos/Build/Products/Release/Postino.app
      DMG: build/release/Postino-${{ needs.version.outputs.version }}.dmg
    steps:
      # Without GOOGLE_CLIENT_ID the app builds fine but no Gmail Account can connect (README, "Client OAuth di
      # Google"); without SPARKLE_ED_PRIVATE_KEY no appcast can be signed (#122): both stop the job before any build.
      - name: Required secrets are set
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          missing=0
          for name in GOOGLE_CLIENT_ID SPARKLE_ED_PRIVATE_KEY; do
            test -n "${!name}" || { echo "::error::Secret $name is not set"; missing=1; }
          done
          exit "$missing"
      - uses: actions/checkout@v4
      # A tag release is final (immutable cache, appcast signature): a rerun never overwrites it, before any build.
      - name: No tag release of this version yet
        if: github.event_name == 'push'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: tool/release/r2_unreleased.sh "macos/$VERSION/Postino-$VERSION.dmg"
      - name: Flutter matches .fvmrc
        run: |
          want=$(sed -n 's/.*"flutter"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .fvmrc)
          have=$(flutter --version | sed -n 's/^Flutter \([^ ]*\).*/\1/p')
          test "$want" = "$have" || { echo "Flutter $have on runner, $want pinned"; exit 1; }
      # Generated code is committed (checked by ci.yml), so no codegen here.
      # macOS uses the iOS-type client: ID only, no GOOGLE_CLIENT_SECRET (README).
      # The build number (CFBundleVersion, what Sparkle compares) grows with the version: build_number.sh.
      - name: flutter build macos --release
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          build=$(tool/release/build_number.sh "$VERSION")
          flutter build macos --release --build-number="$build" --dart-define=GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID"
      - name: Developer ID certificate in a job keychain
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: tool/release/keychain_create.sh
      - run: tool/release/sign_app.sh "$APP"
      - name: Notarize and staple the app
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: tool/release/notarize.sh "$APP"
      - run: tool/release/make_dmg.sh "$APP" "$DMG"
      # Last use of the certificate: the keychain goes now, and even when an earlier step failed.
      - name: Delete the job keychain
        if: always()
        run: tool/release/keychain_delete.sh
      - name: Notarize and staple the DMG
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: tool/release/notarize.sh "$DMG"
      - run: tool/release/verify.sh "$APP" "$DMG"
      # Every run signs it, so a wrong key fails a manual run too; only a tag release of the highest version
      # publishes it, below, after its DMG. The app's SUFeedURL (<base>/macos/appcast.xml) is what installed copies
      # poll: the DMG link is built from it, and a RELEASE_BASE_URL pointing elsewhere stops the job.
      - name: Signed Sparkle appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          RELEASE_BASE_URL: ${{ vars.RELEASE_BASE_URL }}
        run: |
          feed=$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$APP/Contents/Info.plist")
          base=${feed%/macos/appcast.xml}
          test "$base/macos/appcast.xml" = "$feed" || { echo "::error::SUFeedURL $feed is not <base>/macos/appcast.xml"; exit 1; }
          if [ -n "$RELEASE_BASE_URL" ] && [ "${RELEASE_BASE_URL%/}" != "$base" ]; then
            echo "::error::RELEASE_BASE_URL $RELEASE_BASE_URL is not the base of SUFeedURL $feed"
            exit 1
          fi
          tool/release/appcast.sh "$DMG" "$base/macos/$VERSION/" build/release/appcast.xml
      - name: Upload the DMG to R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          # Public base of the bucket (custom domain), a repository variable; optional.
          RELEASE_BASE_URL: ${{ vars.RELEASE_BASE_URL }}
        run: |
          upload() {
            tool/release/r2_upload.sh "$DMG" "$1" application/x-apple-diskimage "$2"
            echo "- macOS: ${RELEASE_BASE_URL:+${RELEASE_BASE_URL%/}/}$1" >> "$GITHUB_STEP_SUMMARY"
          }
          # A tag build is final; a manual build of the same version is replaced by its tag run, so short cache.
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            upload "macos/$VERSION/Postino-$VERSION.dmg" 'public, max-age=31536000, immutable'
            # Stable link for invitees: only a tag release of the highest version moves it.
            latest=$(tool/release/is_latest.sh "$VERSION")
            if [ "$latest" = yes ]; then
              upload macos/latest/Postino.dmg 'public, max-age=300'
              # Sparkle's feed (#122), after the DMG it points at: installed copies find this version.
              tool/release/r2_upload.sh build/release/appcast.xml macos/appcast.xml application/xml 'public, max-age=300'
              echo "- macOS appcast: ${RELEASE_BASE_URL:+${RELEASE_BASE_URL%/}/}macos/appcast.xml" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            upload "macos/$VERSION/Postino-$VERSION.dmg" 'public, max-age=300'
          fi

  android:
    needs: version
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
      APK: build/app/outputs/flutter-apk/app-release.apk
      # Upload key certificate (public): verify_apk.sh refuses any other signer, the debug key included.
      ANDROID_CERT_SHA256: 47:03:4A:D7:65:75:3A:E5:27:8C:6C:09:F6:5E:E8:5F:E7:6B:26:56:85:9C:04:AC:78:54:2D:8A:8D:12:1F:04
    steps:
      # Before any build: a missing secret would otherwise surface late, or as an APK no Account can use.
      - name: Required secrets are set
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          missing=0
          for name in GOOGLE_CLIENT_ID ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ACCOUNT_ID R2_BUCKET; do
            test -n "${!name}" || { echo "::error::Secret $name is not set"; missing=1; }
          done
          exit "$missing"
      - uses: actions/checkout@v4
      # As for the DMG: a tag release is never overwritten.
      - name: No tag release of this version yet
        if: github.event_name == 'push'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: tool/release/r2_unreleased.sh "android/$VERSION/Postino-$VERSION.apk"
      - name: Flutter matches .fvmrc
        run: |
          want=$(sed -n 's/.*"flutter"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .fvmrc)
          have=$(flutter --version | sed -n 's/^Flutter \([^ ]*\).*/\1/p')
          test "$want" = "$have" || { echo "Flutter $have on runner, $want pinned"; exit 1; }
      - name: Upload keystore in RUNNER_TEMP
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: tool/release/android_keystore.sh
      # Generated code is committed (checked by ci.yml), so no codegen here. JDK and ANDROID_HOME come from the
      # runner, as in ci.yml's android job. Android uses the iOS-type client: ID only (README).
      - name: flutter build apk --release
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --dart-define=GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID"
      # Last use of the keystore: it goes now, and even when an earlier step failed.
      - name: Delete the upload keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.p12"
      - run: tool/release/verify_apk.sh "$APK" "$ANDROID_CERT_SHA256"
      - name: Upload the APK to R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          RELEASE_BASE_URL: ${{ vars.RELEASE_BASE_URL }}
        run: |
          echo "- Android APK sha256: \`$(shasum -a 256 "$APK" | cut -d ' ' -f 1)\`" >> "$GITHUB_STEP_SUMMARY"
          upload() {
            tool/release/r2_upload.sh "$APK" "$1" application/vnd.android.package-archive "$2"
            echo "- Android: ${RELEASE_BASE_URL:+${RELEASE_BASE_URL%/}/}$1" >> "$GITHUB_STEP_SUMMARY"
          }
          # Same cache policy as the DMG: a tag build is final, a manual build is replaced by its tag run.
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            upload "android/$VERSION/Postino-$VERSION.apk" 'public, max-age=31536000, immutable'
            latest=$(tool/release/is_latest.sh "$VERSION")
            if [ "$latest" = yes ]; then
              upload android/latest/Postino.apk 'public, max-age=300'
            fi
          else
            upload "android/$VERSION/Postino-$VERSION.apk" 'public, max-age=300'
          fi
