include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    # strict-casts e strict-raw-types: attivati in PR2 (#87) insieme ai fix.
    strict-inference: true
  exclude:
    - build/**
    - android/**
    - ios/**
    - windows/**
    - macos/**
    - linux/**

formatter:
  page_width: 120

linter:
  rules:
    - cancel_subscriptions
    - directives_ordering
    - avoid_redundant_argument_values
    - prefer_const_constructors
    - prefer_const_literals_to_create_immutables
    - prefer_const_declarations
    - prefer_final_locals
    - avoid_multiple_declarations_per_line
    - prefer_int_literals
    - unnecessary_lambdas
    - unnecessary_raw_strings
    - use_super_parameters
    - matching_super_parameters
    - unnecessary_primary_constructor_body
    - sort_constructors_first
    - sort_unnamed_constructors_first
    - prefer_const_constructors_in_immutables
    - use_key_in_widget_constructors
    - prefer_initializing_formals
    - unnecessary_constructor_name
    - tighten_type_of_initializing_formals
    - empty_constructor_bodies
    - avoid_unnecessary_containers
    - use_null_aware_elements
    - use_enums
    - use_late_for_private_fields_and_variables
    - unnecessary_underscores
    - no_wildcard_variable_uses
    - avoid_positional_boolean_parameters
    - avoid_slow_async_io
    - unawaited_futures
    - cascade_invocations
    - missing_whitespace_between_adjacent_strings

    # Regole attivate in PR2 (#87) insieme ai fix manuali delle violazioni residue:
    # missing_whitespace_between_adjacent_strings, avoid_dynamic_calls, cascade_invocations,
    # comment_references, unawaited_futures, avoid_slow_async_io, avoid_positional_boolean_parameters,
    # avoid_catches_without_on_clauses, discarded_futures, close_sinks.
    # use_if_null_to_convert_nulls_to_bools: omessa, deprecata nell'SDK 3.13.7.
